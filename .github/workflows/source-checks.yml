# Adapted from AI Build Kit; see docs/SOURCES.md.
name: source checks
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-kit-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check generated adapters
        run: .agents/tools/build-adapters.sh --check
      - name: Validate the kit
        run: .agents/tools/validate-kit.sh
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install contract check dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/contract-checks"
          "$RUNNER_TEMP/contract-checks/bin/python" -m pip install -r .agents/tools/schema-requirements.txt
          echo "$RUNNER_TEMP/contract-checks/bin" >> "$GITHUB_PATH"
      - name: Install checksum-verified OpenTofu
        run: |
          python3 .agents/tools/install-tofu.py "$RUNNER_TEMP/opentofu"
          echo "$RUNNER_TEMP/opentofu" >> "$GITHUB_PATH"
      - name: Run the test suite
        run: .agents/tests/run-all.sh
